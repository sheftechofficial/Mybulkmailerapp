<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shefbuilkmailer</title>
<style>
:root{--o:#B9560B;--n:#023C6A}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#f6f4f1;color:#1d1d1d}
header{background:var(--n);color:#fff;padding:14px 20px;font-weight:700}
main{max-width:920px;margin:auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{background:#fff;border:1px solid #ddd;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
button.on,button.p{background:var(--o);color:#fff;border-color:var(--o)}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:4px 0 10px}
textarea{min-height:140px}table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}.wrap{overflow-x:auto;max-height:360px;overflow-y:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
#log{max-height:240px;overflow:auto;font-size:13px;white-space:pre-wrap}small{color:#666}
</style></head><body>
<header>Shefbuilkmailer</header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let K=L('sm_k',[]),R=null,RE='',C=L('sm_c',[]),P=L('sm_p',{limit:300,gap:5,footer:'Sheftechofficial, Osogbo, Nigeria\nNot interested? Just reply STOP and I won\'t email you again.'}),
T=L('sm_t',[
{d:0,s:'Quick idea for {{company}}',b:'Hi {{name}},\n\nI took a look at {{company}} and spotted a couple of small things that could be costing you sales. Happy to send a short free audit if you want it.\n\nWant me to send it over?\n\nShefiu'},
{d:3,s:'Re: Quick idea for {{company}}',b:'Hi {{name}},\n\nJust following up. One quick tip: a clearer product page and a faster checkout often lift conversions without spending more on ads. I can show you exactly where to start.\n\nShefiu'},
{d:7,s:'Should I close your file, {{name}}?',b:'Hi {{name}},\n\nI don\'t want to crowd your inbox, so this is my last note. If improving {{company}} is on your list, just reply and we\'ll talk. If not, no worries at all.\n\nShefiu'}]);
let pw=sessionStorage.getItem('sm_pw')||'',tab='contacts',stop=false;
const save=()=>{S('sm_k',K);S('sm_c',C);S('sm_p',P);S('sm_t',T)};
const fill=(t,c)=>t.replace(/{{name}}/g,c.name||'there').replace(/{{company}}/g,c.company||'your store').replace(/{{email}}/g,c.email);
const today=()=>new Date().toDateString();
const sentToday=()=>C.reduce((n,c)=>n+c.sent.filter(x=>new Date(x.ts).toDateString()===today()).length,0);
const elig=st=>C.filter(c=>c.status==='new'&&!c.sent.some(x=>x.step===st)&&(st===1||(p=>p&&Date.now()-p.ts>=T[st-1].d*864e5)(c.sent.find(x=>x.step===st-1))));
const b64=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const mk=(c,st,k)=>{k=k||'test';const e=b64(c.email),O=location.origin+'/api/t?',ul=O+'a=u&c='+k+'&e='+e;const main=fill(T[st-1].b,c)+'\n\n--\n'+P.footer;
const h=esc(main).replace(/https?:\/\/[^\s<]+/g,u=>'<a href="'+O+'a=c&c='+k+'&e='+e+'&u='+b64(u.replace(/&amp;/g,'&'))+'">'+u+'</a>').replace(/\n/g,'<br>');
return{to:c.email,subject:fill(T[st-1].s,c),text:main+'\nUnsubscribe: '+ul,unsub:ul,html:'<div style="font:15px/1.6 Arial,sans-serif">'+h+'<br><br><a href="'+ul+'" style="color:#888;font-size:12px">Unsubscribe</a><img src="'+O+'a=o&c='+k+'&e='+e+'" width="1" height="1" alt=""></div>'}};
async function api(body,p){const r=await fetch(p||'/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,...body})});const j=await r.json().catch(()=>({error:'Server error'}));if(!r.ok)throw new Error(j.error||'Failed');return j}
function log(m){const l=$('#log');if(l){l.textContent=new Date().toLocaleTimeString()+'  '+m+'\n'+l.textContent}}
function login(){$('#app').innerHTML='<div class="card"><h3>Login</h3><input id="pw" type="password" placeholder="Your dashboard password"><button class="p" onclick="doLogin()">Enter</button><p id="err" style="color:#b00"></p></div>'}
async function doLogin(){pw=$('#pw').value;try{await api({ping:1});sessionStorage.setItem('sm_pw',pw);render()}catch(e){$('#err').textContent=e.message}}
function render(){
const tabs=['contacts','campaign','send','reports'].map(t=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';render();if(tab=='reports')loadStats()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
let h=`<nav>${tabs}<button onclick="sessionStorage.removeItem('sm_pw');pw='';login()">Log out</button></nav>`;
if(tab==='contacts'){
h+=`<div class="card"><h3>Add contacts (${C.length})</h3><small>One per line: email, name, company</small><textarea id="imp" placeholder="john@store.com, John, John's Store"></textarea><button class="p" onclick="imp()">Import</button> <button onclick="exp()">Export backup CSV</button></div>
<div class="card wrap"><table><tr><th>Email</th><th>Name</th><th>Company</th><th>Steps sent</th><th>Status</th><th></th></tr>${C.map((c,i)=>`<tr><td>${esc(c.email)}</td><td>${esc(c.name)}</td><td>${esc(c.company)}</td><td>${c.sent.map(x=>x.step).join(',')||'-'}</td><td><select onchange="C[${i}].status=this.value;save()" style="margin:0"><option ${c.status==='new'?'selected':''} value="new">Active</option><option ${c.status==='replied'?'selected':''} value="replied">Replied</option><option ${c.status==='unsub'?'selected':''} value="unsub">Unsubscribed</option><option ${c.status==='bounced'?'selected':''} value="bounced">Bounced</option></select></td><td><button onclick="C.splice(${i},1);save();render()">x</button></td></tr>`).join('')}</table></div>`}
if(tab==='campaign'){h+=T.map((t,i)=>`<div class="card"><h3>Step ${i+1}</h3><div class="row"><div><small>Send ${i?'days after previous step':'immediately'}</small><input type="number" ${i?'':'disabled'} value="${t.d}" onchange="T[${i}].d=+this.value;save()"></div><div><small>Subject</small><input value="${esc(t.s)}" onchange="T[${i}].s=this.value;save()"></div></div><small>Body. Use {{name}}, {{company}}, {{email}}</small><textarea onchange="T[${i}].b=this.value;save()">${esc(t.b)}</textarea></div>`).join('')+`<div class="card"><small>Footer added to every email (keep a way to opt out)</small><textarea onchange="P.footer=this.value;save()">${esc(P.footer)}</textarea></div>`}
if(tab==='send'){const st=[1,2,3].map(s=>`<option value="${s}">Step ${s} (${elig(s).length} ready)</option>`).join('');
h+=`<div class="card"><h3>Send</h3><div class="row"><div><small>Which step</small><select id="st">${st}</select></div><div><small>Daily limit (Gmail is safest at 300 or less)</small><input id="lim" type="number" value="${P.limit}" onchange="P.limit=+this.value;save()"></div><div><small>Seconds between batches</small><input id="gap" type="number" value="${P.gap}" onchange="P.gap=+this.value;save()"></div></div><p>Sent today: <b>${sentToday()}</b> of ${P.limit}</p><button class="p" onclick="run()">Start sending</button> <button onclick="stop=true">Stop</button><hr><small>Send a test to yourself first</small><div class="row"><input id="te" placeholder="your@email.com"><button onclick="test()">Send test</button></div></div><div class="card"><b>Activity</b><div id="log"></div></div>`}
if(tab==='reports')h+=rep();$('#app').innerHTML=h}
function imp(){const v=$('#imp').value.split('\n');let n=0;v.forEach(l=>{const[p,q,r]=l.split(',').map(x=>x.trim());if(p&&/^\S+@\S+\.\S+$/.test(p)&&!C.some(c=>c.email.toLowerCase()===p.toLowerCase())){C.push({email:p,name:q||'',company:r||'',status:'new',sent:[]});n++}});save();render();alert(n+' contacts added')}
function exp(){const b=new Blob([['email,name,company,status,steps'].concat(C.map(c=>[c.email,c.name,c.company,c.status,c.sent.map(x=>x.step).join('|')].join(','))).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contacts.csv';a.click()}
async function test(){const to=$('#te').value;if(!to)return;try{const r=await api({emails:[mk({email:to,name:'Test',company:'Test Store',sent:[]},+$('#st').value)]});log(r.results[0].ok?'Test sent to '+to:'Test failed: '+r.results[0].error)}catch(e){log(e.message)}}
async function run(){stop=false;const st=+$('#st').value;let q=elig(st).slice(0,Math.max(0,P.limit-sentToday()));if(!q.length){log('Nobody ready for this step, or daily limit reached.');return}
const k='k'+Date.now().toString(36),cp={id:k,step:st,ts:Date.now(),sent:0,bounced:0};K.push(cp);log('Starting: '+q.length+' emails');
for(let i=0;i<q.length&&!stop;i+=3){const b=q.slice(i,i+3);try{const r=await api({emails:b.map(c=>mk(c,st,k))});r.results.forEach((x,j)=>{if(x.ok){b[j].sent.push({step:st,ts:Date.now(),k});cp.sent++;log('Sent to '+x.to)}else{const hard=/^5/.test(x.code||'');if(hard){b[j].status='bounced';cp.bounced++}log((hard?'BOUNCED ':'FAILED ')+x.to+': '+x.error)}});save()}catch(e){log('Stopped: '+e.message);break}
await new Promise(r=>setTimeout(r,P.gap*1000))}
save();log(stop?'Stopped.':'Done.')}
async function loadStats(){RE='';try{R=await api({ids:K.map(k=>k.id)},'/api/stats');(R.unsub||[]).forEach(e=>{const c=C.find(x=>x.email.toLowerCase()===e.toLowerCase());if(c&&c.status==='new')c.status='unsub'});save()}catch(e){RE=e.message}render()}
const pc=(a,b)=>b?(100*a/b).toFixed(1)+'%':'-',cd=(t,v,s)=>'<div class="card" style="flex:1;min-width:130px;text-align:center;margin:0"><small>'+t+'</small><div style="font-size:24px;font-weight:700">'+v+'</div><small>'+(s||'')+'</small></div>';
function eng(){const m={};C.forEach(c=>m[c.email.toLowerCase()]={c,o:0,k:0});if(R)K.forEach(k=>{const d=R.camps[k.id]||{};(d.o||[]).forEach(e=>{const x=m[e.toLowerCase()];if(x)x.o++});(d.k||[]).forEach(e=>{const x=m[e.toLowerCase()];if(x)x.k++})});return Object.values(m)}
function expHot(){const rows=eng().filter(x=>x.o||x.k).sort((a,b)=>(b.k*3+b.o)-(a.k*3+a.o)).map(x=>[x.c.email,x.c.name,x.c.company,x.o,x.k].join(','));const b=new Blob([['email,name,company,opens,clicks'].concat(rows).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='engaged-leads.csv';a.click()}
function rep(){
const sent=K.reduce((n,c)=>n+c.sent,0),bn=K.reduce((n,c)=>n+c.bounced,0);let ou=0,ku=0,uu=0;
const D=k=>(R&&R.camps[k.id])||{};K.forEach(k=>{const d=D(k);ou+=(d.o||[]).length;ku+=(d.k||[]).length;uu+=(d.u||[]).length});
const br=sent+bn?100*bn/(sent+bn):0,ur=sent?100*uu/sent:0,risk=br>5||ur>1?['High','#b00']:br>2||ur>.5?['Medium','#c80']:['Low','#2a7'];
const E=eng().filter(x=>x.c.sent.length),hot=E.filter(x=>x.k),warm=E.filter(x=>!x.k&&x.o),cold=E.filter(x=>!x.o&&!x.k),top=E.filter(x=>x.o||x.k).sort((a,b)=>(b.k*3+b.o)-(a.k*3+a.o)).slice(0,25);
let h='<div class="card"><button class="p" onclick="loadStats()">Refresh report</button> <button onclick="expHot()">Export engaged leads CSV</button>'+(RE?'<p style="color:#b00">'+esc(RE)+'</p>':'')+'<p><small>Opens are approximate: some mail apps load images automatically or block them. Clicks are the most reliable signal.</small></p></div>';
h+='<div class="row" style="margin-bottom:14px">'+cd('Emails sent',sent,C.length+' contacts')+cd('Bounce rate',pc(bn,sent+bn),bn+' bounced')+cd('Open rate',pc(ou,sent),ou+' unique opens')+cd('Click rate',pc(ku,sent),ku+' unique clicks')+'</div>';
h+='<div class="row" style="margin-bottom:14px">'+cd('Click-to-open',pc(ku,ou))+cd('Unsubscribe rate',pc(uu,sent),uu+' unsubscribed')+cd('Reply rate',pc(C.filter(c=>c.status==='replied').length,sent),'marked Replied')+cd('Spam risk','<span style="color:'+risk[1]+'">'+risk[0]+'</span>','from bounces + unsubscribes')+'</div>';
h+='<div class="card wrap"><h3>Campaigns</h3><table><tr><th>Date</th><th>Step</th><th>Sent</th><th>Bounced</th><th>Opens</th><th>Clicks</th><th>Unsubs</th></tr>'+(K.slice().reverse().map(k=>{const d=D(k);return'<tr><td>'+new Date(k.ts).toLocaleDateString()+'</td><td>'+k.step+'</td><td>'+k.sent+'</td><td>'+k.bounced+'</td><td>'+(d.o||[]).length+' ('+pc((d.o||[]).length,k.sent)+')</td><td>'+(d.k||[]).length+' ('+pc((d.k||[]).length,k.sent)+')</td><td>'+(d.u||[]).length+'</td></tr>'}).join('')||'<tr><td colspan="7">No campaigns yet</td></tr>')+'</table></div>';
h+='<div class="card"><h3>Audience</h3><div class="row">'+cd('Hot (clicked)',hot.length)+cd('Warm (opened)',warm.length)+cd('Cold (no open)',cold.length)+cd('Not emailed',C.length-E.length)+'</div></div>';
h+='<div class="card wrap"><h3>Most engaged leads</h3><table><tr><th>Email</th><th>Name</th><th>Company</th><th>Opens</th><th>Clicks</th></tr>'+(top.map(x=>'<tr><td>'+esc(x.c.email)+'</td><td>'+esc(x.c.name)+'</td><td>'+esc(x.c.company)+'</td><td>'+x.o+'</td><td>'+x.k+'</td></tr>').join('')||'<tr><td colspan="5">Nobody yet. Press Refresh after sending.</td></tr>')+'</table></div>';
return h}
pw?render():login();
</script></body></html>
