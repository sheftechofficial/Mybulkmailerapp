<style>
:root{--o:#B9560B;--n:#023C6A}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#f6f4f1;color:#1d1d1d}
header{background:var(--n);color:#fff;padding:14px 20px;font-weight:700}
main{max-width:920px;margin:auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{background:#fff;border:1px solid #ddd;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
button.on,button.p{background:var(--o);color:#fff;border-color:var(--o)}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:4px 0 10px}
textarea{min-height:140px}table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}.wrap{overflow-x:auto;max-height:360px;overflow-y:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}

if(l==='minimal'||!X)return '<div style="font:15px/1.6 Arial,sans-serif;color:#222;padding:12px">'+(t.h?'<b>'+esc(fill(t.h,c))+'</b><br><br>':'')+bd+(btn?'<br><br>'+btn:'')+'<br><br>'+so+'<br><br><span style="color:#888;font-size:12px">'+ft+'<br><a href="'+ul+'" style="color:#888">Unsubscribe</a></span>'+px+'</div>';

const mk=(c,st,k)=>{k=k||'test';const t=T[st-1],e=b64(c.email),ul=location.origin+'/api/t?x='+AU.x+'&a=u&c='+k+'&e='+e;
return{to:c.email,subject:fill(t.s,c),text:(t.h?fill(t.h,c)+'\n\n':'')+fill(t.b,c)+(t.bt&&fill(t.bu||'',c)?'\n\n'+t.bt+': '+fill(t.bu,c):'')+'\n\n'+fill(t.so||'',c).split('\n').filter(x=>x.trim()).join('\n')+'\n\n--\n'+P.footer+'\nUnsubscribe: '+ul,unsub:ul,html:html(t,c,k)}};
async function api(body,p){const r=await fetch(p||'/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({auth:AU,...body})});const j=await r.json().catch(()=>({error:'Server error'}));if(!r.ok)throw new Error(j.error||'Failed');return j}
function log(m){const l=$('#log');if(l){l.textContent=new Date().toLocaleTimeString()+'  '+m+'\n'+l.textContent}}
function login(){$('#app').innerHTML='<div class="card" style="max-width:460px;margin:auto"><h3>Sign in with your own email</h3><small>Mail provider</small><select id="lp"><option value="gmail">Gmail</option><option value="outlook">Outlook / Hotmail</option><option value="yahoo">Yahoo</option><option value="zoho">Zoho</option></select><small>Your email address</small><input id="lu" type="email" autocomplete="off"><small>App Password (not your normal password)</small><input id="lw" type="password" autocomplete="off"><small>Sender name (what people see)</small><input id="ln" placeholder="Your name or business"><small>Access code (only if the owner gave you one)</small><input id="lc" type="password"><label><input id="lr" type="checkbox" style="width:auto"> Remember me on this device</label><br><br><button class="p" onclick="doLogin()">Sign in</button><p id="err" style="color:#b00"></p><small>For Gmail: turn on 2-Step Verification, then create an App Password in your Google Account security settings. Your details are only used to send your emails and are never saved on the server.</small></div>'}
function outt(){sessionStorage.removeItem('sm_au');localStorage.removeItem('sm_au');AU=null;login()}
async function doLogin(){const a={p:$('#lp').value,user:$('#lu').value.trim(),pass:$('#lw').value,name:$('#ln').value.trim(),code:$('#lc').value},rm=$('#lr').checked;AU=a;$('#err').textContent='Checking...';try{const r=await api({ping:1});a.x=r.x;AU=a;(rm?localStorage:sessionStorage).setItem('sm_au',JSON.stringify(a));render()}catch(e){AU=null;$('#err').textContent=e.message}}
function render(){
const tabs=['contacts','templates','campaign','send','reports'].map(t=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';render();if(tab=='reports')loadStats()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
let h=`<nav>${tabs}<button onclick="outt()">Log out</button></nav>`;
if(tab==='contacts'){const ls=lists(),vs=P.vl&&ls.includes(P.vl)?P.vl:'all',rows=C.map((c,i)=>[c,i]).filter(([c])=>vs==='all'||c.list===vs);
h+=`<div class="card"><h3>Your lists</h3><div class="row"><div><small>Viewing</small><select onchange="P.vl=this.value;save();render()"><option value="all">All lists (${C.length})</option>${ls.map(l=>`<option ${vs===l?'selected':''} value="${esc(l)}">${esc(l)} (${C.filter(c=>c.list===l).length})</option>`).join('')}</select></div><div style="display:flex;align-items:end;gap:6px;padding-bottom:10px"><button onclick="renL()" ${vs==='all'?'disabled':''}>Rename list</button><button onclick="delL()" ${vs==='all'?'disabled':''}>Delete list</button></div></div></div>
<div class="card"><h3>Add contacts to a list</h3><small>List name (type a new name, or pick an existing list to add to it)</small><input id="iln" list="dl" value="${vs==='all'?'':esc(vs)}" placeholder="e.g. Shopify store owners"><datalist id="dl">${ls.map(l=>`<option value="${esc(l)}">`).join('')}</datalist><small>One per line: email, name, company</small><textarea id="imp" placeholder="john@store.com, John, John's Store"></textarea><button class="p" onclick="imp()">Import to this list</button> <button onclick="exp()">Export backup CSV</button></div>
<div class="card wrap"><table><tr><th>Email</th><th>Name</th><th>Company</th><th>List</th><th>Steps sent</th><th>Status</th><th></th></tr>${rows.map(([c,i])=>`<tr><td>${esc(c.email)}</td><td>${esc(c.name)}</td><td>${esc(c.company)}</td><td><select onchange="C[${i}].list=this.value;save();render()" style="margin:0">${ls.map(l=>`<option ${c.list===l?'selected':''} value="${esc(l)}">${esc(l)}</option>`).join('')}</select></td><td>${c.sent.map(x=>x.step).join(',')||'-'}</td><td><select onchange="C[${i}].status=this.value;save()" style="margin:0"><option ${c.status==='new'?'selected':''} value="new">Active</option><option ${c.status==='replied'?'selected':''} value="replied">Replied</option><option ${c.status==='unsub'?'selected':''} value="unsub">Unsubscribed</option><option ${c.status==='bounced'?'selected':''} value="bounced">Bounced</option></select></td><td><button onclick="C.splice(${i},1);save();render()">x</button></td></tr>`).join('')}</table></div>`}
if(tab==='campaign'){h+=T.map((t,i)=>`<div class="card"><h3>Step ${i+1}</h3><div class="row"><div><small>Send ${i?'days after previous step':'immediately'}</small><input type="number" ${i?'':'disabled'} value="${t.d}" onchange="T[${i}].d=+this.value;save()"></div><div><small>Subject</small><input value="${esc(t.s)}" onchange="T[${i}].s=this.value;save()"></div></div><small>Body. Use {{name}}, {{company}}, {{email}}</small><textarea onchange="T[${i}].b=this.value;save()">${esc(t.b)}</textarea><button onclick="ED={a:'T',i:${i}};tab='templates';render()">Edit design of this step</button> <small>Design: ${esc(t.n||'custom')}</small></div>`).join('')+`<div class="card"><small>Footer added to every email (keep a way to opt out)</small><textarea onchange="P.footer=this.value;save()">${esc(P.footer)}</textarea></div>`}
if(tab==='send'){const st=[1,2,3].map(s=>`<option value="${s}">Step ${s} (${elig(s).length} ready)</option>`).join('');
h+=`<div class="card"><h3>Send</h3><div class="row"><div><small>Send to list</small><select id="sl" onchange="P.sl=this.value;save();render()"><option value="all">All lists</option>${lists().map(l=>`<option ${P.sl===l?'selected':''} value="${esc(l)}">${esc(l)} (${C.filter(c=>c.list===l).length})</option>`).join('')}</select></div><div><small>Which step</small><select id="st">${st}</select></div><div><small>Daily limit (Gmail is safest at 300 or less)</small><input id="lim" type="number" value="${P.limit}" onchange="P.limit=+this.value;save()"></div><div><small>Seconds between batches</small><input id="gap" type="number" value="${P.gap}" onchange="P.gap=+this.value;save()"></div></div><p>Sent today: <b>${sentToday()}</b> of ${P.limit}</p><button class="p" onclick="run()">Start sending</button> <button onclick="stop=true">Stop</button><hr><small>Send a test to yourself first</small><div class="row"><input id="te" placeholder="your@email.com"><button onclick="test()">Send test</button></div></div><div class="card"><b>Activity</b><div id="log"></div></div>`}
if(tab==='templates')h+=tpl();if(tab==='reports')h+=rep();$('#app').innerHTML=h;hyd()}
function imp(){const ln=$('#iln').value.trim();if(!ln){alert('Give your list a name first, for example "Shopify store owners".');return}const v=$('#imp').value.split('\n');let n=0,d=0;v.forEach(l=>{const[p,q,r]=l.split(',').map(x=>x.trim());if(p&&/^\S+@\S+\.\S+$/.test(p)){if(C.some(c=>c.list===ln&&c.email.toLowerCase()===p.toLowerCase()))d++;else{C.push({email:p,name:q||'',company:r||'',status:'new',sent:[],list:ln});n++}}});P.vl=ln;save();render();alert(n+' contacts added to "'+ln+'"'+(d?' ('+d+' duplicates skipped)':''))}
function renL(){const o=P.vl,n=prompt('New name for this list',o);if(n&&n.trim()){C.forEach(c=>{if(c.list===o)c.list=n.trim()});if(P.sl===o)P.sl=n.trim();if(P.rl===o)P.rl=n.trim();P.vl=n.trim();save();render()}}
function delL(){const o=P.vl;if(confirm('Delete the list "'+o+'" and all its contacts?')){C=C.filter(c=>c.list!==o);P.vl='all';if(P.sl===o)P.sl='all';if(P.rl===o)P.rl='all';save();render()}}
function exp(){const b=new Blob([['email,name,company,list,status,steps'].concat(C.map(c=>[c.email,c.name,c.company,c.list,c.status,c.sent.map(x=>x.step).join('|')].join(','))).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contacts.csv';a.click()}
async function test(){const to=$('#te').value;if(!to)return;try{const r=await api({emails:[mk({email:to,name:'Test',company:'Test Store',sent:[]},+$('#st').value)]});log(r.results[0].ok?'Test sent to '+to:'Test failed: '+r.results[0].error)}catch(e){log(e.message)}}
async function run(){stop=false;const st=+$('#st').value;let q=elig(st).filter((c,i,a)=>a.findIndex(z=>z.email.toLowerCase()===c.email.toLowerCase())===i).slice(0,Math.max(0,P.limit-sentToday()));if(!q.length){log('Nobody ready for this step, or daily limit reached.');return}
const k='k'+Date.now().toString(36),cp={id:k,step:st,ts:Date.now(),sent:0,bounced:0,list:(P.sl&&P.sl!=='all'?P.sl:'All lists')};K.push(cp);log('Starting: '+q.length+' emails');
for(let i=0;i<q.length&&!stop;i+=3){const b=q.slice(i,i+3);try{const r=await api({emails:b.map(c=>mk(c,st,k))});r.results.forEach((x,j)=>{if(x.ok){C.forEach(z=>{if(z.email.toLowerCase()===b[j].email.toLowerCase()&&!z.sent.some(y=>y.step===st))z.sent.push({step:st,ts:Date.now(),k})});cp.sent++;log('Sent to '+x.to)}else{const hard=/^5/.test(x.code||'');if(hard){C.forEach(z=>{if(z.email.toLowerCase()===b[j].email.toLowerCase())z.status='bounced'});cp.bounced++}log((hard?'BOUNCED ':'FAILED ')+x.to+': '+x.error)}});save()}catch(e){log('Stopped: '+e.message);break}
await new Promise(r=>setTimeout(r,P.gap*1000))}
save();log(stop?'Stopped.':'Done.')}
async function loadStats(){RE='';try{R=await api({ids:K.map(k=>k.id)},'/api/stats');(R.unsub||[]).forEach(e=>{C.forEach(c=>{if(c.email.toLowerCase()===e.toLowerCase()&&c.status==='new')c.status='unsub'})});save()}catch(e){RE=e.message}render()}
const pc=(a,b)=>b?(100*a/b).toFixed(1)+'%':'-',cd=(t,v,s)=>'<div class="card" style="flex:1;min-width:130px;text-align:center;margin:0"><small>'+t+'</small><div style="font-size:24px;font-weight:700">'+v+'</div><small>'+(s||'')+'</small></div>';
function eng(){const m={};C.forEach(c=>m[c.email.toLowerCase()]={c,o:0,k:0});if(R)K.forEach(k=>{const d=R.camps[k.id]||{};(d.o||[]).forEach(e=>{const x=m[e.toLowerCase()];if(x)x.o++});(d.k||[]).forEach(e=>{const x=m[e.toLowerCase()];if(x)x.k++})});return Object.values(m)}
function expHot(){const rows=eng().filter(x=>x.o||x.k).sort((a,b)=>(b.k*3+b.o)-(a.k*3+a.o)).map(x=>[x.c.email,x.c.name,x.c.company,x.o,x.k].join(','));const b=new Blob([['email,name,company,opens,clicks'].concat(rows).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='engaged-leads.csv';a.click()}
function rep(){
const sent=K.reduce((n,c)=>n+c.sent,0),bn=K.reduce((n,c)=>n+c.bounced,0);let ou=0,ku=0,uu=0;
const D=k=>(R&&R.camps[k.id])||{};K.forEach(k=>{const d=D(k);ou+=(d.o||[]).length;ku+=(d.k||[]).length;uu+=(d.u||[]).length});
const br=sent+bn?100*bn/(sent+bn):0,ur=sent?100*uu/sent:0,risk=br>5||ur>1?['High','#b00']:br>2||ur>.5?['Medium','#c80']:['Low','#2a7'];
const E=eng().filter(x=>x.c.sent.length&&(!P.rl||P.rl==='all'||x.c.list===P.rl)),hot=E.filter(x=>x.k),warm=E.filter(x=>!x.k&&x.o),cold=E.filter(x=>!x.o&&!x.k),top=E.filter(x=>x.o||x.k).sort((a,b)=>(b.k*3+b.o)-(a.k*3+a.o)).slice(0,25);
let h='<div class="card"><button class="p" onclick="loadStats()">Refresh report</button> <button onclick="expHot()">Export engaged leads CSV</button>'+(RE?'<p style="color:#b00">'+esc(RE)+'</p>':'')+'<p><small>Opens are approximate: some mail apps load images automatically or block them. Clicks are the most reliable signal.</small></p></div>';
h+='<div class="row" style="margin-bottom:14px">'+cd('Emails sent',sent,C.length+' contacts')+cd('Bounce rate',pc(bn,sent+bn),bn+' bounced')+cd('Open rate',pc(ou,sent),ou+' unique opens')+cd('Click rate',pc(ku,sent),ku+' unique clicks')+'</div>';
h+='<div class="row" style="margin-bottom:14px">'+cd('Click-to-open',pc(ku,ou))+cd('Unsubscribe rate',pc(uu,sent),uu+' unsubscribed')+cd('Reply rate',pc(C.filter(c=>c.status==='replied').length,sent),'marked Replied')+cd('Spam risk','<span style="color:'+risk[1]+'">'+risk[0]+'</span>','from bounces + unsubscribes')+'</div>';
h+='<div class="card wrap"><h3>Campaigns</h3><table><tr><th>Date</th><th>Step</th><th>List</th><th>Sent</th><th>Bounced</th><th>Opens</th><th>Clicks</th><th>Unsubs</th></tr>'+(K.slice().reverse().map(k=>{const d=D(k);return'<tr><td>'+new Date(k.ts).toLocaleDateString()+'</td><td>'+k.step+'</td><td>'+esc(k.list||'-')+'</td><td>'+k.sent+'</td><td>'+k.bounced+'</td><td>'+(d.o||[]).length+' ('+pc((d.o||[]).length,k.sent)+')</td><td>'+(d.k||[]).length+' ('+pc((d.k||[]).length,k.sent)+')</td><td>'+(d.u||[]).length+'</td></tr>'}).join('')||'<tr><td colspan="7">No campaigns yet</td></tr>')+'</table></div>';
h+='<div class="card"><h3>Audience</h3><small>Show list</small><select onchange="P.rl=this.value;save();render()"><option value="all">All lists</option>'+lists().map(l=>'<option '+(P.rl===l?'selected':'')+' value="'+esc(l)+'">'+esc(l)+'</option>').join('')+'</select><div class="row">'+cd('Hot (clicked)',hot.length)+cd('Warm (opened)',warm.length)+cd('Cold (no open)',cold.length)+cd('Not emailed',C.filter(c=>!c.sent.length&&(!P.rl||P.rl==='all'||c.list===P.rl)).length)+'</div></div>';
h+='<div class="card wrap"><h3>Most engaged leads</h3><table><tr><th>Email</th><th>Name</th><th>Company</th><th>Opens</th><th>Clicks</th></tr>'+(top.map(x=>'<tr><td>'+esc(x.c.email)+'</td><td>'+esc(x.c.name)+'</td><td>'+esc(x.c.company)+'</td><td>'+x.o+'</td><td>'+x.k+'</td></tr>').join('')||'<tr><td colspan="5">Nobody yet. Press Refresh after sending.</td></tr>')+'</table></div>';
return h}
